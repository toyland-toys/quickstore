# Nginx config for the exported Expo web app.
#
# Two jobs: serve the single-page app, and proxy /api to the backend so the
# browser talks to one origin (no CORS, no backend URL compiled into the bundle).
#
# $BACKEND_ORIGIN is substituted at container start from the environment.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploaded images can be large; the API also accepts image PUTs when the
    # backend stores files locally.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API and server-rendered storefront pages go to the backend.
    location /api/ {
        proxy_pass $BACKEND_ORIGIN;
        proxy_http_version 1.1;
        # $proxy_host (not $host, which is *this* frontend's own hostname) is the
        # host nginx parsed out of proxy_pass above -- i.e. the backend's own
        # hostname. Needed both as the Host header, since a multi-tenant host
        # like Render routes HTTP requests by it, and as the TLS SNI value
        # (proxy_ssl_server_name), since the same kind of host also terminates
        # TLS per-hostname and otherwise has no way to know which backend's
        # certificate to present -- without it the handshake is rejected
        # outright ("SSL alert number 40 / handshake_failure"), before the
        # request ever reaches the backend.
        proxy_set_header Host              $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Don't buffer image responses through nginx.
        proxy_buffering off;
    }

    # Runtime config must never be cached, or a redeployed backend URL would be
    # ignored by browsers holding an old copy.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Fingerprinted bundle assets are safe to cache hard.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html itself must be revalidated so a new deploy is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # A bare "/handle" (e.g. /zeetoys) is a seller's public storefront, server-
    # rendered by the backend at /api/shop/{handle} -- not a client-side route,
    # so it can't be reached through the SPA fallback below. Match it before
    # that fallback and rewrite it into the backend route directly.
    #
    # The alternation excludes this app's own top-level single-segment routes
    # (kept in sync with app/*.tsx and app/(tabs)/*.tsx by hand -- there's no
    # way to generate this list from the Expo Router file tree at nginx-config
    # time) so a real app screen is never mistaken for a seller handle. Multi-
    # segment routes (/product/*, /onboarding/*) and /api/, /_expo/, /assets/
    # don't need excluding: the pattern only matches a single path segment, so
    # those never reach this block. Handle syntax mirrors backend/server.py's
    # own validation (^[a-z0-9][a-z0-9_-]{2,29}$).
    #
    # Quoted: nginx's config tokenizer treats a bare, unquoted { as a block
    # start even mid-token (e.g. inside {2,29}), which breaks the directive.
    location ~ "^/(?!admin/?$|groups/?$|visitors/?$|storefront-preview/?$|pin-lock/?$|catalog/?$|orders/?$|store/?$)([a-z0-9][a-z0-9_-]{2,29})/?$" {
        proxy_pass $BACKEND_ORIGIN/api/shop/$1;
        proxy_http_version 1.1;
        proxy_set_header Host              $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The bare root is a static marketing/landing page (public/landing.html),
    # not the seller app: onboarding only happens via the mobile app, so a
    # fresh web visit to "/" should see the landing page instead of being sent
    # straight into the signup flow. An exact match always wins over both the
    # handle-routing regex above (which never matches a bare "/" anyway, since
    # it requires an actual handle) and the SPA fallback below, so every other
    # path -- including /onboarding/phone, which the landing page itself links
    # to for existing/returning sellers -- still reaches the app exactly as
    # before.
    location = / {
        try_files /landing.html =404;
    }

    # Single-page app: unknown paths are client-side routes, so fall back to
    # index.html rather than returning 404.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
